    <main>
        <form id="contact-form" action="" >
            <div class="form_item">
                <label for="topic">Тема</label> <br>
                <select name="topic" id="topic">
                    <option value="1"> Заказать услугу</option>
                    <option value="2"> Оставить отзыв/замечание</option>
                    <option value="3"> Предложить сотрудничсетво</option>
                    <option value="4"> Другое</option>
                </select>
            </div>

            <div class="form_item">
                <label for="name">Имя</label> <br>
                  <input name="name" id="name" type="text" placeholder="Введите ваше имя" required>
            </div>
            <div class="form_item">
                <label for="date"> Дата рождения</label> <br>
                  <input name="date" id="date" type="date" required>
            </div>
            <div class="form_item">
                <label for="phone"> Телефон</label> <br>
                  <input name="phone" id="phone" type="tel" placeholder="+7 (812) 993-42-67" required>
            </div>
             <div class="form_item">
                 <label for="name">E-mail</label> <br>
                  <input name="email" id="email" type="email" placeholder="example@mail.com" required>
            </div>
             <div class="form_item">
                 <label for="textarea">Текст сообщения</label> <br>
                 <textarea name="message" id="message" rows="5" required></textarea> <br>
             </div>
                <div class="form_item">
                <input name="name" id="name" type="submit" class="knopka"></input>
                </div>
        </form>
